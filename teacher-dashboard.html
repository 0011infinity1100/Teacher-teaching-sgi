<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Subject Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:  linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        . header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .input-section {
            background: white;
            padding: 30px;
            border-radius:  10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size:  1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .input-group button {
            padding:  12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #764ba2;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .subject-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .subject-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        . subject-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        . subject-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-view, .btn-edit, .btn-delete {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: opacity 0.3s;
        }

        .btn-view {
            background: #667eea;
            color: white;
        }

        .btn-edit {
            background: #ffc107;
            color: #333;
        }

        . btn-delete {
            background:  #e74c3c;
            color: white;
        }

        .btn-view:hover, .btn-edit:hover, .btn-delete:hover {
            opacity: 0.8;
        }

        . empty-state {
            text-align: center;
            color: white;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
        }

        . empty-state p {
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left:  0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal. active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: #ddd;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-save {
            padding: 10px 20px;
            background:  #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel:hover, .btn-save:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Teacher Subject Manager</h1>
            <p>Organize and manage your subjects and sections</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="subjectInput" 
                    placeholder="Enter subject or section name (e.g., Math-Class A, English-Class B)"
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="addSubject()">Add Subject</button>
            </div>
        </div>

        <div id="subjectsContainer" class="subjects-grid"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Subject</div>
            <input type="text" id="editInput" placeholder="Subject name">
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-save" onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let subjects = JSON.parse(localStorage.getItem('subjects')) || [];
        let editingIndex = -1;

        function renderSubjects() {
            const container = document.getElementById('subjectsContainer');
            
            if (subjects.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <p>👇 Start by adding your first subject or section! </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = subjects.map((subject, index) => `
                <div class="subject-card">
                    <h2>${subject.name}</h2>
                    <div class="subject-info">
                        <p><strong>Created:</strong> ${new Date(subject.createdAt).toLocaleDateString()}</p>
                    </div>
                    <div class="subject-actions">
                        <button class="btn-view" onclick="viewSubject(${index})">View</button>
                        <button class="btn-edit" onclick="editSubject(${index})">Edit</button>
                        <button class="btn-delete" onclick="deleteSubject(${index})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function addSubject() {
            const input = document.getElementById('subjectInput');
            const name = input.value.trim();

            if (!name) {
                alert('Please enter a subject name');
                return;
            }

            const subject = {
                name: name,
                createdAt: new Date().toISOString()
            };

            subjects.push(subject);
            saveToLocalStorage();
            input.value = '';
            renderSubjects();
        }

        function editSubject(index) {
            editingIndex = index;
            document.getElementById('editInput').value = subjects[index].name;
            document. getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document. getElementById('editModal').classList.remove('active');
            editingIndex = -1;
        }

        function saveEdit() {
            const newName = document.getElementById('editInput').value.trim();
            if (!newName) {
                alert('Please enter a subject name');
                return;
            }
            subjects[editingIndex].name = newName;
            saveToLocalStorage();
            renderSubjects();
            closeEditModal();
        }

        function deleteSubject(index) {
            if (confirm(`Are you sure you want to delete "${subjects[index].name}"?`)) {
                subjects.splice(index, 1);
                saveToLocalStorage();
                renderSubjects();
            }
        }

        function viewSubject(index) {
            alert(`Viewing: ${subjects[index].name}\n\nYou can expand this to show student lists, schedules, assignments, etc.`);
        }

        function handleKeyPress(event) {
            if (event. key === 'Enter') {
                addSubject();
            }
        }

        function saveToLocalStorage() {
            localStorage. setItem('subjects', JSON.stringify(subjects));
        }

        // Initial render
        renderSubjects();
    </script>
</body>
</html>
